server {
    listen 8008;
    listen [::]:8008;
    server_name 192.168.101.34;

    root /var/www/broker-dashboard;
    index index.html;

    location /api/internal/ {
    	proxy_pass http://127.0.0.1:9000/api/internal/;
    	proxy_http_version 1.1;
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
    	proxy_pass http://127.0.0.1:9000/auth/;
    	proxy_http_version 1.1;
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin/ is both a backend API prefix (admin CRUD endpoints) and a
    # frontend SPA route (/admin/brokers, /admin/users). Full-page browser
    # navigations request text/html — serve index.html for those so React
    # Router handles the route. Actual API calls (axios, Accept: application/json)
    # are proxied to the backend.
    location /admin/ {
    	if ($http_accept ~* "text/html") {
    		rewrite ^ /index.html break;
    	}

    	proxy_pass http://127.0.0.1:9000/admin/;
    	proxy_http_version 1.1;
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/broker-dashboard.access.log;
    error_log  /var/log/nginx/broker-dashboard.error.log;
}