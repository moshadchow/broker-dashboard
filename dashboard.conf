server {
    listen 8008;
    listen [::]:8008;
    server_name 192.168.101.34;

    root /var/www/broker-dashboard;
    index index.html;

    location /api/ {
    	proxy_pass https://uat.xfltrade.com:20121/api/;
    	proxy_http_version 1.1;
    	proxy_set_header Host uat.xfltrade.com;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto https;   # <-- was $scheme (http), force https
    	proxy_ssl_server_name on;
    
    	# intercept backend redirects, don't pass to browser
    	proxy_redirect https://uat.xfltrade.com:20121/api/ /api/;
    }
	
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/broker-dashboard.access.log;
    error_log  /var/log/nginx/broker-dashboard.error.log;
}